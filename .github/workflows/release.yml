name: Release

# Fully automated: bump VERSION (which /ship does) and merge to main, and this
# builds the macOS app and publishes a GitHub Release with the .dmg/.zip and
# notes pulled from CHANGELOG.md. No manual tagging or uploads.

on:
  push:
    branches: [main]
    paths: ["VERSION"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      should_release: ${{ steps.v.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — nothing to do."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version v$VERSION — will build and release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build & Release macOS
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: macos-14 # Apple Silicon — native modules compile for arm64
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # electron-builder stamps the .dmg/.zip names, Info.plist, and in-app
      # "About" version from package.json — not VERSION. Sync them so the built
      # artifacts match the v$VERSION release tag instead of drifting behind.
      - name: Sync package.json version from VERSION
        run: npm pkg set version="${{ needs.check.outputs.version }}"

      - name: Rebuild native modules for Electron arm64
        run: npx electron-rebuild -f -t prod
        env:
          npm_config_arch: arm64

      - name: Compile native binaries
        run: npm run compile:native

      # Bundle on-device engines. Authenticated (GITHUB_TOKEN) to avoid the 60/hr
      # unauthenticated GitHub API limit. Non-fatal: users can fetch at runtime.
      - name: Download whisper-cpp
        run: npm run download:whisper-cpp || echo "::warning::whisper-cpp download failed — runtime fallback"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download llama-server
        run: npm run download:llama-server || echo "::warning::llama-server download failed — runtime fallback"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download sherpa-onnx (Parakeet)
        run: npm run download:sherpa-onnx || echo "::warning::sherpa-onnx download failed — runtime fallback"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build renderer
        run: cd src && npx vite build

      - name: Build macOS arm64 (unsigned)
        run: npx electron-builder --mac --arm64 --config.mac.identity=null --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Auto-update depends on this manifest (updater.js requests the
      # latest-arm64 channel). Fail loudly if electron-builder didn't emit it.
      - name: Verify update manifest was generated
        run: test -f dist/latest-arm64-mac.yml

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          V="${{ needs.check.outputs.version }}"
          {
            echo "notes<<CHANGELOG_EOF"
            awk -v ver="$V" '
              $0 ~ ("^## \\[" ver "\\]") {f=1; next}
              /^## \[/ {f=0}
              f {print}
            ' CHANGELOG.md
            echo ""
            echo "### Install"
            echo "Download the \`.dmg\`, open it, and drag **WhisperWoof** to Applications."
            echo "Unsigned build — on first launch, right-click the app → **Open**, or run:"
            echo '```'
            echo "xattr -dr com.apple.quarantine /Applications/WhisperWoof.app"
            echo '```'
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: WhisperWoof v${{ needs.check.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
