name: Release

# Fully automated: bump VERSION (which /ship does) and merge to main, and this
# builds the macOS app and publishes a GitHub Release with the .dmg/.zip and
# notes pulled from CHANGELOG.md. No manual tagging or uploads.

on:
  push:
    branches: [main]
    paths: ["VERSION"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      should_release: ${{ steps.v.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — nothing to do."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version v$VERSION — will build and release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build & Release macOS
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: macos-14 # Apple Silicon — native modules compile for arm64
    permissions:
      contents: write
    env:
      # Developer ID signing + notarization switch on by themselves once these
      # repo secrets exist (see docs/release-signing.md). Until then the
      # release is built unsigned, exactly as before.
      HAS_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # electron-builder stamps the .dmg/.zip names, Info.plist, and in-app
      # "About" version from package.json — not VERSION. Sync them so the built
      # artifacts match the v$VERSION release tag instead of drifting behind.
      - name: Sync package.json version from VERSION
        run: npm pkg set version="${{ needs.check.outputs.version }}"

      - name: Rebuild native modules for Electron arm64
        run: npx electron-rebuild -f -t prod
        env:
          npm_config_arch: arm64

      - name: Compile native binaries
        run: npm run compile:native

      # Bundle on-device engines. Authenticated (GITHUB_TOKEN) to avoid the 60/hr
      # unauthenticated GitHub API limit. Non-fatal: users can fetch at runtime.
      - name: Download whisper-cpp
        run: npm run download:whisper-cpp || echo "::warning::whisper-cpp download failed — runtime fallback"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download llama-server
        run: npm run download:llama-server || echo "::warning::llama-server download failed — runtime fallback"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download sherpa-onnx (Parakeet)
        run: npm run download:sherpa-onnx || echo "::warning::sherpa-onnx download failed — runtime fallback"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build renderer
        run: cd src && npx vite build

      # Signed + notarized: opens like any Mac app, and in-app updates install
      # themselves (Squirrel requires a signature), so no update-mode override.
      # publish.channel=latest-arm64: the app looks for latest-arm64-mac.yml
      # (src/updater.js sets that channel per arch); without this the file
      # is named latest-mac.yml and every check 404s.
      - name: Build macOS arm64 (signed + notarized)
        if: env.HAS_SIGNING == 'true'
        run: npx electron-builder --mac --arm64 --config.publish.channel=latest-arm64 --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Unsigned (ad-hoc, see scripts/after-pack-adhoc-sign.js).
      # whisperwoofUpdateMode=manual: the app still checks for new releases,
      # but an unsigned build cannot self-install (Squirrel refuses), so the
      # prompt opens this release page for a manual download instead of a
      # download that can never finish.
      - name: Build macOS arm64 (unsigned)
        if: env.HAS_SIGNING != 'true'
        run: npx electron-builder --mac --arm64 --config.mac.identity=null --config.mac.notarize=false --config.publish.channel=latest-arm64 --config.extraMetadata.whisperwoofUpdateMode=manual --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          V="${{ needs.check.outputs.version }}"
          {
            echo "notes<<CHANGELOG_EOF"
            awk -v ver="$V" '
              $0 ~ ("^## \\[" ver "\\]") {f=1; next}
              /^## \[/ {f=0}
              f {print}
            ' CHANGELOG.md
            echo ""
            echo "### Install"
            if [ "$HAS_SIGNING" = "true" ]; then
              echo "Download the \`.dmg\`, open it, and drag **WhisperWoof** into Applications. Updates install from inside the app."
            else
              echo "**Easiest:** paste this into Terminal. It downloads this release, checks it, installs it and opens it:"
              echo '```'
              echo "curl -fsSL https://raw.githubusercontent.com/h3qing/WhisperWoof/main/scripts/install.sh | bash"
              echo '```'
              echo "**Or with the \`.dmg\`:** open it and drag **WhisperWoof** into Applications. This build isn't signed by Apple yet, so the first time you open it macOS says it can't verify the app: click **Done**, then go to **System Settings → Privacy & Security**, scroll down and click **Open Anyway**."
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: WhisperWoof v${{ needs.check.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
